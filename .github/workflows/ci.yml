name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    # Windows, not Linux. Part of the suite measures whether the numbers still
    # fit their slots, and that depends on the font: without Segoe UI the
    # fallback is wider, and the layout is only promised where it runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, tests included
        run: npx tsc --noEmit

      - name: Install the browser
        run: npx playwright install chromium

      - name: Test
        run: npm test

      - name: The suite must leave the tree alone
        run: git diff --exit-code

  hygiene:
    name: Hygiene
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # The skeleton came from another app, and a name left behind in a string
      # or a path is exactly the kind of thing that ships unnoticed. The code
      # is checked; the README credits the skeleton on purpose.
      - name: No leftovers from the skeleton
        run: |
          if git grep -n -i "fluxdock" -- src src-tauri scripts tests index.html package.json ':!src-tauri/sounds'; then
            echo "the old app's name is still in the tree" >&2
            exit 1
          fi

      # The house style has no long dashes anywhere, in code or in prose.
      - name: No long dashes
        run: |
          if git grep -n -P "\x{2014}|\x{2013}" -- ':!LICENSE'; then
            echo "an em or en dash crept in" >&2
            exit 1
          fi

  rust-linux:
    name: Rust (Linux)
    # Older than the newest on purpose: a binary built against a newer glibc
    # will not start on a distribution that ships an older one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf

      - run: npm ci
      - run: npm run build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The live output tests are ignored here; a runner has no sound device.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The bundle embeds the built interface, so the Rust build needs dist/
      # to exist before it can compile at all.
      - run: npm ci
      - run: npm run build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
